<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AI Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #07090f;
            --glass: rgba(255, 255, 255, 0.055);
            --glass-strong: rgba(255, 255, 255, 0.085);
            --glass-border: rgba(255, 255, 255, 0.10);
            --text: #f5f7fb;
            --muted: rgba(255, 255, 255, 0.55);
            --accent: #8b7cff;
            --danger: #ff7272;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(111, 92, 255, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(0, 200, 255, 0.09),
                    transparent 30%
                ),
                #07090f;

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100%;

            display: flex;

            position: relative;
            overflow: hidden;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 300px;
            height: 100%;

            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            padding: 16px;

            background: rgba(11, 14, 23, 0.70);

            border-right:
                1px solid var(--glass-border);

            backdrop-filter:
                blur(25px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(150%);

            z-index: 50;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.25),
                    rgba(255, 255, 255, 0.06)
                );

            border:
                1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 8px 30px rgba(0, 0, 0, 0.18);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;

            color: #bdb5ff;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;

            letter-spacing: -0.2px;
        }

        .brand-subtitle {
            font-size: 11px;

            color: var(--muted);

            margin-top: 2px;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {
            position: relative;

            margin-bottom: 15px;
        }

        .search-box svg {
            position: absolute;

            left: 13px;
            top: 50%;

            width: 17px;
            height: 17px;

            transform: translateY(-50%);

            color: var(--muted);

            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            height: 42px;

            padding:
                0 13px 0 40px;

            color: var(--text);

            outline: none;

            border-radius: 13px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            background:
                rgba(255, 255, 255, 0.045);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .search-box input::placeholder {
            color:
                rgba(255, 255, 255, 0.35);
        }

        .search-box input:focus {
            border-color:
                rgba(139, 124, 255, 0.4);

            background:
                rgba(255, 255, 255, 0.065);
        }

        /* =====================================================
           NEW CHAT
        ===================================================== */

        .new-chat {
            width: 100%;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 17px;

            border:
                1px solid rgba(139, 124, 255, 0.22);

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.18),
                    rgba(255, 255, 255, 0.045)
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 8px 25px rgba(0, 0, 0, 0.12);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .new-chat svg {
            width: 17px;
            height: 17px;
        }

        .new-chat:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.28),
                    rgba(255, 255, 255, 0.065)
                );

            border-color:
                rgba(139, 124, 255, 0.35);
        }

        .new-chat:active {
            transform: scale(0.98);
        }

        /* =====================================================
           SIDEBAR TITLE
        ===================================================== */

        .sidebar-section-title {
            color: var(--muted);

            font-size: 11px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.7px;

            margin:
                0 4px 9px;
        }

        /* =====================================================
           CONVERSATION LIST
        ===================================================== */

        .conversation-list {
            flex: 1;

            overflow-y: auto;

            padding-right: 3px;
        }

        .conversation-list::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .conversation-list::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background:
                rgba(255, 255, 255, 0.10);

            border-radius: 10px;
        }

        .conversation-item-wrap {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 5px;

            margin-bottom: 5px;
        }

        .conversation-item {
            min-width: 0;

            flex: 1;

            height: 45px;

            display: flex;
            align-items: center;

            padding:
                0 12px;

            color:
                rgba(255, 255, 255, 0.68);

            text-align: left;

            background: transparent;

            border:
                1px solid transparent;

            border-radius: 12px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .conversation-item:hover {
            background:
                rgba(255, 255, 255, 0.045);

            border-color:
                rgba(255, 255, 255, 0.06);

            color: white;
        }

        .conversation-item.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.14),
                    rgba(255, 255, 255, 0.035)
                );

            border-color:
                rgba(139, 124, 255, 0.16);
        }

        .conversation-title {
            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 13px;
        }

        /* =====================================================
           DELETE BUTTON
        ===================================================== */

        .delete-conversation {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border-radius: 11px;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            color:
                rgba(255, 255, 255, 0.45);

            background:
                rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .delete-conversation svg {
            width: 16px;
            height: 16px;
        }

        .delete-conversation:hover {
            color: #ff7c7c;

            background:
                rgba(255, 75, 75, 0.12);

            border-color:
                rgba(255, 100, 100, 0.24);

            transform: scale(1.05);
        }

        .delete-conversation:active {
            transform: scale(0.92);
        }

        /* =====================================================
           SEARCH RESULTS
        ===================================================== */

        .search-result {
            width: 100%;

            padding: 11px;

            margin-bottom: 7px;

            text-align: left;

            border-radius: 13px;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            background:
                rgba(255, 255, 255, 0.035);

            color: white;

            cursor: pointer;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .search-result:hover {
            background:
                rgba(255, 255, 255, 0.065);

            border-color:
                rgba(139, 124, 255, 0.22);

            transform: translateY(-1px);
        }

        .search-result-top {
            display: flex;
            justify-content: space-between;

            gap: 8px;

            margin-bottom: 7px;
        }

        .search-result-conversation {
            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 11px;
            font-weight: 600;

            color:
                rgba(255, 255, 255, 0.62);
        }

        .search-result-role {
            flex-shrink: 0;

            font-size: 10px;

            padding:
                3px 7px;

            border-radius: 7px;

            background:
                rgba(139, 124, 255, 0.12);

            color: #bcb5ff;
        }

        .search-snippet {
            color:
                rgba(255, 255, 255, 0.72);

            font-size: 12px;

            line-height: 1.5;
        }

        .search-snippet mark {
            color: white;

            background:
                rgba(139, 124, 255, 0.32);

            border-radius: 4px;

            padding:
                1px 3px;
        }

        .no-results {
            padding:
                25px 10px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

            line-height: 1.6;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            min-width: 0;

            flex: 1;

            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 64px;

            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding:
                0 20px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            background:
                rgba(7, 9, 15, 0.38);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            z-index: 20;
        }

        .menu-button {
            width: 39px;
            height: 39px;

            display: none;

            align-items: center;
            justify-content: center;

            margin-right: 10px;

            border-radius: 11px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            background:
                rgba(255, 255, 255, 0.045);

            color: white;

            cursor: pointer;
        }

        .menu-button svg {
            width: 19px;
            height: 19px;
        }

        .topbar-title {
            font-size: 14px;

            font-weight: 600;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-messages {
            flex: 1;

            overflow-y: auto;

            padding:
                35px max(
                    20px,
                    calc((100vw - 950px) / 2)
                );

            scroll-behavior: smooth;
        }

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome-inner {
            max-width: 570px;

            padding: 30px;
        }

        .welcome-icon {
            width: 64px;
            height: 64px;

            margin:
                0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.20),
                    rgba(255, 255, 255, 0.045)
                );

            border:
                1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .welcome-icon svg {
            width: 29px;
            height: 29px;

            color: #bdb6ff;
        }

        .welcome h1 {
            margin:
                0 0 9px;

            font-size:
                clamp(25px, 4vw, 36px);

            letter-spacing: -1px;
        }

        .welcome p {
            margin: 0;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.7;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message-row {
            display: flex;

            width: 100%;

            margin-bottom: 24px;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width:
                min(760px, 85%);

            padding:
                13px 16px;

            border-radius: 17px;

            font-size: 14px;

            line-height: 1.7;

            word-wrap: break-word;

            overflow-wrap: anywhere;
        }

        .message-row.user
        .message-content {

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.20),
                    rgba(139, 124, 255, 0.09)
                );

            border:
                1px solid rgba(139, 124, 255, 0.18);

            border-bottom-right-radius: 5px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.13),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        .message-row.assistant
        .message-content {

            background:
                rgba(255, 255, 255, 0.038);

            border:
                1px solid rgba(255, 255, 255, 0.065);

            border-bottom-left-radius: 5px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.09),
                inset 0 1px 0 rgba(255, 255, 255, 0.045);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .message-content p {
            margin:
                0 0 10px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* =====================================================
           CODE BLOCK
        ===================================================== */

        .code-wrapper {
            margin:
                12px 0;

            overflow: hidden;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            background:
                rgba(0, 0, 0, 0.30);
        }

        .code-header {
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 10px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            color: var(--muted);

            font-size: 10px;
        }

        .copy-code {
            border: 0;

            padding:
                5px 8px;

            border-radius: 7px;

            color:
                rgba(255, 255, 255, 0.65);

            background:
                rgba(255, 255, 255, 0.055);

            cursor: pointer;
        }

        .copy-code:hover {
            background:
                rgba(255, 255, 255, 0.10);

            color: white;
        }

        pre {
            margin: 0;

            padding: 13px;

            overflow-x: auto;

            font-size: 12px;

            line-height: 1.6;
        }

        code {
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
        }

        .inline-code {
            padding:
                2px 5px;

            border-radius: 5px;

            background:
                rgba(255, 255, 255, 0.08);

            font-family: monospace;

            font-size: 0.9em;
        }

        /* =====================================================
           SEARCH HIGHLIGHT
        ===================================================== */

        .message-row.search-highlight {
            animation:
                messageHighlight 1.8s ease;
        }

        @keyframes messageHighlight {

            0% {
                transform: scale(1.015);
                filter: brightness(1.45);
            }

            100% {
                transform: scale(1);
                filter: brightness(1);
            }

        }

        /* =====================================================
           TYPING
        ===================================================== */

        .typing {
            display: flex;

            gap: 5px;

            padding:
                7px 4px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.45);

            animation:
                typing 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }

        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-area {
            flex-shrink: 0;

            padding:
                12px max(
                    20px,
                    calc((100vw - 950px) / 2)
                ) 18px;

            background:
                linear-gradient(
                    to top,
                    rgba(7, 9, 15, 0.85),
                    rgba(7, 9, 15, 0)
                );
        }

        .composer {
            display: flex;
            align-items: flex-end;

            gap: 9px;

            padding: 9px;

            border-radius: 17px;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            background:
                rgba(255, 255, 255, 0.055);

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.055);

            backdrop-filter:
                blur(22px)
                saturate(140%);

            -webkit-backdrop-filter:
                blur(22px)
                saturate(140%);
        }

        .composer textarea {
            flex: 1;

            min-height: 40px;

            max-height: 160px;

            padding:
                10px 8px;

            resize: none;

            border: 0;

            outline: none;

            color: white;

            background: transparent;

            font-size: 14px;

            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color:
                rgba(255, 255, 255, 0.35);
        }

        .send-button {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            border:
                1px solid rgba(139, 124, 255, 0.25);

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.28),
                    rgba(111, 92, 255, 0.12)
                );

            color: white;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .send-button svg {
            width: 18px;
            height: 18px;
        }

        .send-button:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(139, 124, 255, 0.40),
                    rgba(111, 92, 255, 0.20)
                );

            transform:
                translateY(-1px);
        }

        .send-button:active {
            transform: scale(0.94);
        }

        .send-button:disabled {
            opacity: 0.4;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           DELETE MODAL
        ===================================================== */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.58);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            z-index: 200;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width:
                min(390px, 100%);

            padding: 24px;

            border-radius: 20px;

            border:
                1px solid rgba(255, 255, 255, 0.12);

            background:
                linear-gradient(
                    145deg,
                    rgba(31, 34, 47, 0.88),
                    rgba(13, 16, 25, 0.88)
                );

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.50),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);

            backdrop-filter:
                blur(30px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(150%);

            animation:
                modalIn 0.2s ease;
        }

        @keyframes modalIn {

            from {
                opacity: 0;

                transform:
                    translateY(10px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }

        .modal-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            border-radius: 15px;

            color: #ff8585;

            background:
                rgba(255, 90, 90, 0.10);

            border:
                1px solid rgba(255, 100, 100, 0.15);
        }

        .modal-icon svg {
            width: 23px;
            height: 23px;
        }

        .modal-title {
            margin:
                0 0 7px;

            font-size: 18px;

            font-weight: 700;
        }

        .modal-text {
            margin: 0;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 9px;

            margin-top: 22px;
        }

        .modal-button {
            height: 39px;

            padding:
                0 15px;

            border-radius: 11px;

            cursor: pointer;

            border:
                1px solid rgba(255, 255, 255, 0.09);

            background:
                rgba(255, 255, 255, 0.045);

            color:
                rgba(255, 255, 255, 0.75);

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .modal-button:hover {
            background:
                rgba(255, 255, 255, 0.08);

            color: white;
        }

        .modal-button.danger {
            color: #ff9a9a;

            background:
                rgba(255, 75, 75, 0.10);

            border-color:
                rgba(255, 100, 100, 0.17);
        }

        .modal-button.danger:hover {
            background:
                rgba(255, 75, 75, 0.17);

            border-color:
                rgba(255, 100, 100, 0.28);
        }

        /* =====================================================
           SIDEBAR BACKDROP
        ===================================================== */

        .sidebar-backdrop {
            display: none;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;

                left: 0;
                top: 0;

                width:
                    min(310px, 88vw);

                transform:
                    translateX(-105%);

                box-shadow:
                    25px 0 80px
                    rgba(0, 0, 0, 0.30);
            }

            .sidebar.open {
                transform:
                    translateX(0);
            }

            .sidebar-backdrop {
                position: fixed;

                inset: 0;

                display: block;

                background:
                    rgba(0, 0, 0, 0.45);

                opacity: 0;

                visibility: hidden;

                transition:
                    opacity 0.25s ease,
                    visibility 0.25s ease;

                z-index: 40;

                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }

            .sidebar-backdrop.show {
                opacity: 1;

                visibility: visible;
            }

            .menu-button {
                display: flex;
            }

            .topbar {
                padding:
                    0 13px;
            }

            .chat-messages {
                padding:
                    25px 13px 20px;
            }

            .composer-area {
                padding:
                    8px 10px
                    calc(
                        10px +
                        env(safe-area-inset-bottom)
                    );
            }

            .message-content {
                max-width: 91%;

                font-size: 13.5px;
            }
        }

        @media (max-width: 430px) {

            .welcome-inner {
                padding: 20px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .welcome p {
                font-size: 13px;
            }

            .message-content {
                max-width: 94%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 3a8 8 0 0 0-8 8c0 2.1.8 4 2.2 5.4L5 20l3.8-1.2A8 8 0 1 0 12 3Z"/>
                        <path d="M8.5 11h.01"/>
                        <path d="M12 11h.01"/>
                        <path d="M15.5 11h.01"/>
                    </svg>

                </div>

                <div>

                    <div class="brand-title">
                        AI Chat
                    </div>

                    <div class="brand-subtitle">
                        Percakapan AI
                    </div>

                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <svg
                viewBox="0 0 24 24"
                fill="none"

            >
                <circle

                    cy="11"
                    r="7"
                ></circle>

                <path

                ></path>
            </svg>

            <input

                placeholder="Cari percakapan..."

        <!-- NEW CHAT -->

        <button

            <svg

                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>

            <span>
                Percakapan baru
            </span>

        </button>


        <div
            class="sidebar-section-title"
            id="sidebarSectionTitle"

            Percakapan
        </div>


        <div
            class="conversation-list"

    </aside>


    <div

    <!-- =====================================================

    ====================================================== -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <button

<!-- =====================================================
     DELETE MODAL
====================================================== -->

<div
    class="modal"
    id="deleteModal"
>

    <div class="modal-box">

        <div class="modal-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
            </svg>

        </div>

        <h2 class="modal-title">
            Hapus percakapan?
        </h2>

        <p class="modal-text">
            Percakapan ini akan dihapus dari perangkat
            kamu. Tindakan ini tidak dapat dibatalkan.
        </p>

        <div class="modal-actions">

            <button
                class="modal-button"
                id="cancelDelete"
            >
                Batal
            </button>

            <button

                Hapus
            </button>

<script>

    /* =====================================================
       STORAGE
    ===================================================== */

    const STORAGE_KEY =
        "ai_chat_conversations_v3";

    const CURRENT_KEY =
        "ai_current_conversation";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const sidebar =
        document.getElementById("sidebar");

    const sidebarBackdrop =
        document.getElementById(
            "sidebarBackdrop"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const conversationList =
        document.getElementById(
            "conversationList"
        );

    const sidebarSectionTitle =
        document.getElementById(
            "sidebarSectionTitle"
        );

    const newChatButton =
        document.getElementById(
            "newChatButton"
        );

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const messageInput =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const topbarTitle =
        document.getElementById(
            "topbarTitle"
        );

    const menuButton =
        document.getElementById(
            "menuButton"
        );

    const deleteModal =
        document.getElementById(
            "deleteModal"
        );

    const cancelDelete =
        document.getElementById(
            "cancelDelete"
        );

    const confirmDelete =
        document.getElementById(
            "confirmDelete"
        );


    /* =====================================================
       STATE
    ===================================================== */

    let conversations =
        loadConversations();

    let currentConversationId =
        localStorage.getItem(
            CURRENT_KEY
        );

    let pendingDeleteId = null;

    let isSending = false;


    /* =====================================================
       CREATE ID
    ===================================================== */

    function createId() {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID ===
                "function"
        ) {
            return window.crypto.randomUUID();
        }

        return (
            Date.now().toString(36) +
            Math.random()
                .toString(36)
                .slice(2)
        );
    }


    /* =====================================================
       LOAD CONVERSATIONS
    ===================================================== */

    function loadConversations() {

        try {

            const raw =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!raw) {
                return [];
            }

            const parsed =
                JSON.parse(raw);

            if (!Array.isArray(parsed)) {
                return [];
            }

            let changed = false;

            const result =
                parsed.map(
                    conversation => {

                        const messages =
                            Array.isArray(
                                conversation.messages
                            )
                                ? conversation.messages.map(
                                    message => {

                                        if (
                                            !message.id
                                        ) {

                                            changed =
                                                true;

                                            return {
                                                ...message,
                                                id: createId()
                                            };
                                        }

                                        return message;
                                    }
                                )
                                : [];

                        return {
                            ...conversation,
                            messages
                        };
                    }
                );


            if (changed) {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(result)
                );
            }


            return result;

        } catch (error) {

            console.error(
                "Gagal membaca conversations:",
                error
            );

            return [];
        }
    }


    /* =====================================================
       SAVE
    ===================================================== */

    function saveConversations() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                conversations
            )
        );


        if (currentConversationId) {

            localStorage.setItem(
                CURRENT_KEY,
                currentConversationId
            );

        } else {

            localStorage.removeItem(
                CURRENT_KEY
            );
        }
    }


    /* =====================================================
       CREATE NEW CONVERSATION
    ===================================================== */

    function createNewConversation() {

        const conversation = {

            id: createId(),

            title:
                "Percakapan baru",

            messages: [],

            createdAt:
                Date.now()
        };


        conversations.unshift(
            conversation
        );


        currentConversationId =
            conversation.id;


        searchInput.value = "";


        saveConversations();

        renderSidebar();

        renderConversation();

        messageInput.focus();

        closeSidebar();
    }


    /* =====================================================
       CURRENT CONVERSATION
    ===================================================== */

    function getCurrentConversation() {

        return conversations.find(
            conversation =>
                conversation.id ===
                currentConversationId
        ) || null;
    }


    /* =====================================================
       OPEN CONVERSATION
    ===================================================== */

    function openConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );

        if (!conversation) {
            return;
        }


        currentConversationId = id;

        saveConversations();

        renderConversation();

        closeSidebar();
    }


    /* =====================================================
       DELETE MODAL
    ===================================================== */

    function requestDeleteConversation(id) {

        const conversation =
            conversations.find(
                item =>
                    item.id === id
            );

        if (!conversation) {
            return;
        }


        pendingDeleteId = id;

        deleteModal.classList.add(
            "show"
        );
    }


    function closeDeleteModal() {

        pendingDeleteId = null;

        deleteModal.classList.remove(
            "show"
        );
    }


    /* =====================================================
       DELETE CONVERSATION
    ===================================================== */

    function deleteConversation(id) {

        const index =
            conversations.findIndex(
                item =>
                    item.id === id
            );

        if (index === -1) {
            return;
        }


        const wasCurrent =
            currentConversationId === id;


        conversations.splice(
            index,
            1
        );


        if (wasCurrent) {

            if (conversations.length > 0) {

                currentConversationId =
                    conversations[0].id;

            } else {

                currentConversationId =
                    null;
            }
        }


        saveConversations();

        renderSidebar();

        renderConversation();
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    function openSidebar() {

        sidebar.classList.add(
            "open"
        );

        sidebarBackdrop.classList.add(
            "show"
        );
    }


    function closeSidebar() {

        sidebar.classList.remove(
            "open"
        );

        sidebarBackdrop.classList.remove(
            "show"
        );
    }


    /* =====================================================
       RENDER SIDEBAR
    ===================================================== */

    function renderSidebar() {

        const keyword =
            searchInput.value.trim();


        if (keyword) {

            renderSearchResults(
                keyword
            );

        } else {

            renderConversationList();
        }
    }


    /* =====================================================
       RENDER CONVERSATION LIST
    ===================================================== */

    function renderConversationList() {

        sidebarSectionTitle.textContent =
            "Percakapan";

        conversationList.innerHTML = "";


        if (conversations.length === 0) {

            conversationList.innerHTML = `
                <div class="no-results">
                    Belum ada percakapan.
                </div>
            `;

            return;
        }


        conversations.forEach(
            conversation => {

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "conversation-item-wrap";


                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "conversation-item";


                if (
                    conversation.id ===
                    currentConversationId
                ) {

                    button.classList.add(
                        "active"
                    );
                }


                button.dataset.conversationId =
                    conversation.id;


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "conversation-title";

                title.textContent =
                    conversation.title ||
                    "Percakapan baru";


                button.appendChild(
                    title
                );


                /* DELETE BUTTON */

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-conversation";

                deleteButton.title =
                    "Hapus percakapan";

                deleteButton.setAttribute(
                    "aria-label",
                    "Hapus percakapan"
                );

                deleteButton.dataset.deleteId =
                    conversation.id;


                deleteButton.innerHTML = `
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4h8v2"></path>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v5"></path>
                        <path d="M14 11v5"></path>
                    </svg>
                `;


                wrapper.appendChild(
                    button
                );

                wrapper.appendChild(
                    deleteButton
                );


                conversationList.appendChild(
                    wrapper
                );
            }
        );
    }


    /* =====================================================
       SEARCH RESULTS
    ===================================================== */

    function renderSearchResults(
        keyword
    ) {

        sidebarSectionTitle.textContent =
            "Hasil pencarian";

        conversationList.innerHTML = "";


        const results = [];

        const query =
            keyword.toLowerCase();


        conversations.forEach(
            conversation => {

                conversation.messages.forEach(
                    message => {

                        const content =
                            String(
                                message.content ||
                                ""
                            );


                        if (
                            content
                                .toLowerCase()
                                .includes(query)
                        ) {

                            results.push({
                                conversation,
                                message
                            });
                        }

                    }
                );

            }
        );


        if (results.length === 0) {

            conversationList.innerHTML = `
                <div class="no-results">
                    Tidak ditemukan pesan yang
                    mengandung
                    <strong>${escapeHTML(
                        keyword
                    )}</strong>.
                </div>
            `;

            return;
        }


        results.forEach(
            result => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "search-result";


                button.dataset.searchConversationId =
                    result.conversation.id;

                button.dataset.searchMessageId =
                    result.message.id;


                const top =
                    document.createElement(
                        "div"
                    );

                top.className =
                    "search-result-top";


                const conversationTitle =
                    document.createElement(
                        "div"
                    );

                conversationTitle.className =
                    "search-result-conversation";

                conversationTitle.textContent =
                    result.conversation.title ||
                    "Percakapan baru";


                const role =
                    document.createElement(
                        "span"
                    );

                role.className =
                    "search-result-role";

                role.textContent =
                    result.message.role ===
                    "user"
                        ? "Kamu"
                        : "AI";


                top.appendChild(
                    conversationTitle
                );

                top.appendChild(
                    role
                );


                const snippet =
                    document.createElement(
                        "div"
                    );

                snippet.className =
                    "search-snippet";

                snippet.innerHTML =
                    createSearchSnippet(
                        result.message.content,
                        keyword
                    );


                button.appendChild(
                    top
                );

                button.appendChild(
                    snippet
                );


                conversationList.appendChild(
                    button
                );
            }
        );
    }


    /* =====================================================
       SEARCH SNIPPET
    ===================================================== */

    function createSearchSnippet(
        text,
        query
    ) {

        const clean =
            String(text || "")
                .replace(/\s+/g, " ")
                .trim();


        const lower =
            clean.toLowerCase();

        const search =
            query.toLowerCase();


        const index =
            lower.indexOf(
                search
            );


        if (index === -1) {

            return escapeHTML(
                clean.slice(0, 130)
            );
        }


        const contextBefore = 55;
        const contextAfter = 85;


        let start =
            Math.max(
                0,
                index - contextBefore
            );


        let end =
            Math.min(
                clean.length,
                index +
                query.length +
                contextAfter
            );


        let snippet =
            clean.slice(
                start,
                end
            );


        if (start > 0) {
            snippet =
                "..." + snippet;
        }


        if (end < clean.length) {
            snippet += "...";
        }


        const localIndex =
            snippet
                .toLowerCase()
                .indexOf(search);


        if (localIndex === -1) {

            return escapeHTML(
                snippet
            );
        }


        const before =
            snippet.slice(
                0,
                localIndex
            );


        const match =
            snippet.slice(
                localIndex,
                localIndex +
                query.length
            );


        const after =
            snippet.slice(
                localIndex +
                query.length
            );


        return (
            escapeHTML(before) +
            "<mark>" +
            escapeHTML(match) +
            "</mark>" +
            escapeHTML(after)
        );
    }


    /* =====================================================
       OPEN SEARCH RESULT
    ===================================================== */

    function openSearchResult(
        conversationId,
        messageId
    ) {

        const conversation =
            conversations.find(
                item =>
                    item.id ===
                    conversationId
            );


        if (!conversation) {
            return;
        }


        currentConversationId =
            conversationId;


        saveConversations();

        renderConversation();

        closeSidebar();


        requestAnimationFrame(
            () => {

                const elements =
                    document.querySelectorAll(
                        ".message-row[data-message-id]"
                    );


                let target = null;


                elements.forEach(
                    element => {

                        if (
                            element.dataset
                                .messageId ===
                            messageId
                        ) {

                            target =
                                element;
                        }

                    }
                );


                if (!target) {
                    return;
                }


                target.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });


                target.classList.add(
                    "search-highlight"
                );


                setTimeout(
                    () => {

                        target.classList.remove(
                            "search-highlight"
                        );

                    },
                    1900
                );

            }
        );
    }


    /* =====================================================
       RENDER CONVERSATION
    ===================================================== */

    function renderConversation() {

        const conversation =
            getCurrentConversation();


        if (!conversation) {

            topbarTitle.textContent =
                "Percakapan baru";


            chatMessages.innerHTML = `
                <div class="welcome">

                    <div class="welcome-inner">

                        <div class="welcome-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M12 3a8 8 0 0 0-8 8c0 2.1.8 4 2.2 5.4L5 20l3.8-1.2A8 8 0 1 0 12 3Z"/>
                                <path d="M8.5 11h.01"/>
                                <path d="M12 11h.01"/>
                                <path d="M15.5 11h.01"/>
                            </svg>

                        </div>

                        <h1>
                            Mulai percakapan
                        </h1>

                        <p>
                            Tanyakan sesuatu kepada AI
                            untuk memulai percakapan.
                        </p>

                    </div>

                </div>
            `;

            return;
        }


        topbarTitle.textContent =
            conversation.title ||
            "Percakapan baru";


        if (
            conversation.messages.length ===
            0
        ) {

            chatMessages.innerHTML = `
                <div class="welcome">

                    <div class="welcome-inner">

                        <div class="welcome-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M12 3a8 8 0 0 0-8 8c0 2.1.8 4 2.2 5.4L5 20l3.8-1.2A8 8 0 1 0 12 3Z"/>
                                <path d="M8.5 11h.01"/>
                                <path d="M12 11h.01"/>
                                <path d="M15.5 11h.01"/>
                            </svg>

                        </div>

                        <h1>
                            Mulai percakapan
                        </h1>

                        <p>
                            Tanyakan sesuatu kepada AI
                            untuk memulai percakapan.
                        </p>

                    </div>

                </div>
            `;

            return;
        }


        chatMessages.innerHTML = "";


        conversation.messages.forEach(
            message => {

                addMessageToDOM(
                    message.role,
                    message.content,
                    message.id
                );

            }
        );


        scrollChatToBottom(false);
    }


    /* =====================================================
       ADD MESSAGE TO DOM
    ===================================================== */

    function addMessageToDOM(
        role,
        content,
        messageId
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "message-row " +
            role;


        if (messageId) {

            row.dataset.messageId =
                messageId;
        }


        const messageContent =
            document.createElement(
                "div"
            );

        messageContent.className =
            "message-content";


        messageContent.innerHTML =
            formatMessage(content);


        row.appendChild(
            messageContent
        );


        chatMessages.appendChild(
            row
        );
    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* =====================================================
       FORMAT MESSAGE
       
       PENTING:
       Code block dipisahkan TERLEBIH DAHULU.
       Clipboard menyimpan kode ASLI.
       Tampilan memakai kode yang sudah di-escape.
    ===================================================== */

    function formatMessage(text) {

        const codeBlocks = [];


        /*
         * Ambil code block sebelum escaping.
         */

        let value =
            String(text || "")
                .replace(
                    /```(\w*)\n?([\s\S]*?)```/g,
                    function (
                        _,
                        language,
                        code
                    ) {

                        const index =
                            codeBlocks.length;


                        codeBlocks.push({
                            language:
                                language ||
                                "Code",

                            code:
                                code
                        });


                        return (
                            `___CODE_BLOCK_${index}___`
                        );
                    }
                );


        /*
         * Escape teks biasa.
         *
         * Placeholder code block
         * tidak akan rusak.
         */

        value =
            escapeHTML(value);


        /*
         * Inline code
         */

        value =
            value.replace(
                /`([^`]+)`/g,
                '<span class="inline-code">$1</span>'
            );


        /*
         * Bold
         */

        value =
            value.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


        /*
         * Italic
         */

        value =
            value.replace(
                /\*(.*?)\*/g,
                "<em>$1</em>"
            );


        /*
         * New line
         */

        value =
            value.replace(
                /\n/g,
                "<br>"
            );


        /*
         * Masukkan kembali code block.
         */

        codeBlocks.forEach(
            function (
                block,
                index
            ) {

                /*
                 * Untuk tampilan:
                 * HTML di-escape agar tidak
                 * dieksekusi browser.
                 */

                const codeForDisplay =
                    escapeHTML(
                        block.code
                    );


                /*
                 * Untuk clipboard:
                 * gunakan kode ASLI.
                 */

                const encodedCode =
                    encodeURIComponent(
                        block.code
                    );


                const blockHTML = `
                    <div class="code-wrapper">

                        <div class="code-header">

                            <span>
                                ${escapeHTML(
                                    block.language
                                )}
                            </span>

                            <button
                                class="copy-code"
                                data-code="${encodedCode}"
                            >
                                Copy
                            </button>

                        </div>

                        <pre><code>${codeForDisplay}</code></pre>

                    </div>
                `;


                value =
                    value.replace(
                        `___CODE_BLOCK_${index}___`,
                        blockHTML
                    );
            }
        );


        return value;
    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

        if (isSending) {
            return;
        }


        const prompt =
            messageInput.value.trim();


        if (!prompt) {
            return;
        }


        let conversation =
            getCurrentConversation();


        if (!conversation) {

            createNewConversation();

            conversation =
                getCurrentConversation();
        }


        if (!conversation) {
            return;
        }


        isSending = true;

        sendButton.disabled = true;


        /*
         * USER MESSAGE
         */

        const userMessage = {

            id: createId(),

            role: "user",

            content: prompt,

            createdAt:
                Date.now()
        };


        conversation.messages.push(
            userMessage
        );


        /*
         * TITLE
         */

        if (
            conversation.messages.length ===
            1
        ) {

            conversation.title =
                prompt.length > 45
                    ? prompt.slice(
                        0,
                        45
                    ) + "..."
                    : prompt;
        }


        messageInput.value = "";

        autoResizeTextarea();


        saveConversations();

        renderSidebar();


        /*
         * Hapus welcome
         */

        if (
            chatMessages.querySelector(
                ".welcome"
            )
        ) {

            chatMessages.innerHTML =
                "";
        }


        addMessageToDOM(
            userMessage.role,
            userMessage.content,
            userMessage.id
        );


        scrollChatToBottom(true);


        /*
         * TYPING INDICATOR
         */

        const typingRow =
            document.createElement(
                "div"
            );

        typingRow.className =
            "message-row assistant";

        typingRow.id =
            "typingIndicator";


        typingRow.innerHTML = `
            <div class="message-content">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>
        `;


        chatMessages.appendChild(
            typingRow
        );


        scrollChatToBottom(true);


        try {

            /*
             * API BACKEND
             */

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message:
                                    prompt
                            })
                    }
                );


            const data =
                await response.json();


            const indicator =
                document.getElementById(
                    "typingIndicator"
                );


            if (indicator) {
                indicator.remove();
            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    data.message ||
                    "Gagal mendapatkan jawaban AI."
                );
            }


            /*
             * ASSISTANT MESSAGE
             */

            const assistantMessage = {

                id: createId(),

                role:
                    "assistant",

                content:
                    String(
                        data.answer ||
                        ""
                    ),

                createdAt:
                    Date.now()
            };


            conversation.messages.push(
                assistantMessage
            );


            saveConversations();


            addMessageToDOM(
                assistantMessage.role,
                assistantMessage.content,
                assistantMessage.id
            );


            scrollChatToBottom(true);


        } catch (error) {

            const indicator =
                document.getElementById(
                    "typingIndicator"
                );


            if (indicator) {
                indicator.remove();
            }


            const errorMessage = {

                id: createId(),

                role:
                    "assistant",

                content:
                    "Terjadi kesalahan: " +
                    error.message,

                createdAt:
                    Date.now()
            };


            conversation.messages.push(
                errorMessage
            );


            saveConversations();


            addMessageToDOM(
                errorMessage.role,
                errorMessage.content,
                errorMessage.id
            );


            scrollChatToBottom(true);


            console.error(
                error
            );

        } finally {

            isSending = false;

            sendButton.disabled =
                false;

            messageInput.focus();
        }
    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollChatToBottom(
        smooth = true
    ) {

        chatMessages.scrollTo({

            top:
                chatMessages.scrollHeight,

            behavior:
                smooth
                    ? "smooth"
                    : "auto"
        });
    }


    /* =====================================================
       TEXTAREA RESIZE
    ===================================================== */

    function autoResizeTextarea() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                160
            ) + "px";
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    newChatButton.addEventListener(
        "click",
        createNewConversation
    );


    menuButton.addEventListener(
        "click",
        openSidebar
    );


    sidebarBackdrop.addEventListener(
        "click",
        closeSidebar
    );


    searchInput.addEventListener(
        "input",
        renderSidebar
    );


    /*
     * Sidebar click delegation
     */

    conversationList.addEventListener(
        "click",
        function(event) {

            /*
             * DELETE
             */

            const deleteButton =
                event.target.closest(
                    "[data-delete-id]"
                );


            if (deleteButton) {

                event.stopPropagation();


                requestDeleteConversation(
                    deleteButton.dataset
                        .deleteId
                );


                return;
            }


            /*
             * SEARCH RESULT
             */

            const searchResult =
                event.target.closest(
                    "[data-search-conversation-id]"
                );


            if (searchResult) {

                openSearchResult(

                    searchResult.dataset
                        .searchConversationId,

                    searchResult.dataset
                        .searchMessageId

                );

                return;
            }


            /*
             * NORMAL CONVERSATION
             */

            const conversationButton =
                event.target.closest(
                    "[data-conversation-id]"
                );


            if (conversationButton) {

                openConversation(
                    conversationButton.dataset
                        .conversationId
                );
            }

        }
    );


    /* =====================================================
       CONFIRM DELETE
    ===================================================== */

    confirmDelete.addEventListener(
        "click",
        function() {

            if (pendingDeleteId) {

                deleteConversation(
                    pendingDeleteId
                );
            }


            closeDeleteModal();
        }
    );


    cancelDelete.addEventListener(
        "click",
        closeDeleteModal
    );


    /*
     * Klik luar modal
     */

    deleteModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                deleteModal
            ) {

                closeDeleteModal();
            }

        }
    );


    /* =====================================================
       SEND
    ===================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    messageInput.addEventListener(
        "input",
        autoResizeTextarea
    );


    /*
     * Enter = send
     * Shift + Enter = newline
     */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /* =====================================================
       COPY CODE
       
       Bagian ini mengambil data-code yang
       masih berupa kode ASLI.
    ===================================================== */

    document.addEventListener(
        "click",
        async function(event) {

            const button =
                event.target.closest(
                    ".copy-code"
                );


            if (!button) {
                return;
            }


            const encodedCode =
                button.dataset.code;


            let code;


            try {

                /*
                 * Decode kembali kode asli.
                 */

                code =
                    decodeURIComponent(
                        encodedCode
                    );

            } catch (error) {

                console.error(
                    "Gagal decode code:",
                    error
                );

                return;
            }


            try {

                /*
                 * Clipboard API
                 */

                await navigator.clipboard
                    .writeText(
                        code
                    );


                const oldText =
                    button.textContent;


                button.textContent =
                    "Copied";


                setTimeout(
                    () => {

                        button.textContent =
                            oldText;

                    },
                    1200
                );


            } catch (error) {

                /*
                 * Fallback untuk WebView/browser
                 * yang tidak mendukung Clipboard API.
                 */

                try {

                    const textarea =
                        document.createElement(
                            "textarea"
                        );


                    textarea.value =
                        code;


                    textarea.style.position =
                        "fixed";

                    textarea.style.opacity =
                        "0";


                    document.body.appendChild(
                        textarea
                    );


                    textarea.focus();

                    textarea.select();


                    document.execCommand(
                        "copy"
                    );


                    textarea.remove();


                    const oldText =
                        button.textContent;


                    button.textContent =
                        "Copied";


                    setTimeout(
                        () => {

                            button.textContent =
                                oldText;

                        },
                        1200
                    );


                } catch (fallbackError) {

                    console.error(
                        "Clipboard error:",
                        fallbackError
                    );
                }

            }

        }
    );


    /* =====================================================
       ESC KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                if (
                    deleteModal.classList.contains(
                        "show"
                    )
                ) {

                    closeDeleteModal();

                } else {

                    closeSidebar();
                }

            }

        }
    );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    if (
        !currentConversationId ||
        !conversations.some(
            conversation =>
                conversation.id ===
                currentConversationId
        )
    ) {

        currentConversationId =
            conversations.length > 0
                ? conversations[0].id
                : null;
    }


    saveConversations();

    renderSidebar();

    renderConversation();

</script>

</body>
</html>
