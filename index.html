<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b0d12">

<title>AI Chat</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(120,120,255,.16),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(0,200,255,.10),transparent 28%),
        radial-gradient(circle at 50% 100%,rgba(150,70,255,.12),transparent 35%),
        #090b10;
    color:#eee;
}

body{
    position:relative;
}

button,
textarea,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
}

.orb.one{
    width:260px;
    height:260px;
    background:#635bff;
    top:-100px;
    left:-80px;
}

.orb.two{
    width:300px;
    height:300px;
    background:#00b7ff;
    right:-120px;
    top:25%;
}

.orb.three{
    width:280px;
    height:280px;
    background:#9b4dff;
    bottom:-150px;
    left:30%;
}

/* =========================
   APP
========================= */

.app{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:flex;
    overflow:hidden;
}

/* =========================
   GLASS
========================= */

.glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:290px;
    height:100%;
    flex-shrink:0;

    display:flex;
    flex-direction:column;

    background:rgba(15,17,24,.72);
    border-right:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    z-index:20;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.sidebar-header{
    height:70px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:9px;
}

.new-chat-btn{
    flex:1;
    height:44px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;

    background:rgba(255,255,255,.07);
    color:#fff;

    cursor:pointer;

    display:flex;
    align-items:center;
    gap:9px;

    padding:0 14px;

    transition:.2s;
}

.new-chat-btn:hover{
    background:rgba(255,255,255,.13);
    border-color:rgba(255,255,255,.20);
    transform:translateY(-1px);
}

.new-chat-icon{
    font-size:21px;
    line-height:1;
}

.close-sidebar{
    width:44px;
    height:44px;

    border:1px solid transparent;
    border-radius:13px;

    background:transparent;
    color:#aaa;

    cursor:pointer;
    font-size:20px;

    transition:.2s;
}

.close-sidebar:hover{
    background:rgba(255,255,255,.08);
    color:#fff;
}

/* =========================
   SEARCH
========================= */

.search-box{
    padding:0 13px 12px;
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);

    color:#888;

    pointer-events:none;

    font-size:17px;
}

#searchInput{
    width:100%;
    height:42px;

    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;

    outline:none;

    background:rgba(255,255,255,.055);
    color:#eee;

    padding:0 12px 0 39px;

    transition:.2s;
}

#searchInput::placeholder{
    color:#777;
}

#searchInput:focus{
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.22);
    box-shadow:0 0 0 3px rgba(120,120,255,.08);
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    display:none;
    flex:1;
    overflow-y:auto;
    padding:5px 10px 15px;
}

.search-results.visible{
    display:block;
}

.search-results-title{
    padding:6px 7px 9px;

    color:#888;

    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.search-result{
    width:100%;

    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;

    background:rgba(255,255,255,.045);

    color:#ddd;

    text-align:left;

    padding:11px;

    margin-bottom:7px;

    cursor:pointer;

    transition:.18s;

    overflow:hidden;
}

.search-result:hover{
    background:rgba(255,255,255,.095);
    border-color:rgba(255,255,255,.16);
    transform:translateY(-1px);
}

.search-result-chat{
    color:#777;
    font-size:10px;
    margin-bottom:5px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.search-result-text{
    font-size:12px;
    line-height:1.5;

    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.search-result-text mark{
    background:rgba(255,210,70,.28);
    color:#ffe68a;

    border-radius:3px;
    padding:1px 3px;
}

.search-empty{
    color:#666;
    font-size:13px;
    text-align:center;
    padding:25px 10px;
}

/* =========================
   CONVERSATIONS
========================= */

.conversation-title{
    padding:5px 15px 8px;

    color:#777;

    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.conversation-list{
    flex:1;
    overflow-y:auto;
    padding:0 9px 12px;
}

.conversation-list.hidden{
    display:none;
}

.conversation-item{
    width:100%;
    min-height:45px;

    border:1px solid transparent;
    border-radius:10px;

    background:transparent;

    color:#bbb;

    text-align:left;

    padding:9px 11px;
    margin-bottom:3px;

    cursor:pointer;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    transition:.18s;
}

.conversation-item:hover{
    background:rgba(255,255,255,.06);
}

.conversation-item.active{
    background:rgba(255,255,255,.09);
    border-color:rgba(255,255,255,.08);
    color:#fff;
}

.empty-conversations{
    color:#666;
    font-size:13px;
    padding:15px 10px;
    text-align:center;
}

/* =========================
   MAIN
========================= */

.main{
    min-width:0;
    flex:1;
    height:100%;

    display:flex;
    flex-direction:column;

    position:relative;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:64px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 16px;

    border-bottom:1px solid rgba(255,255,255,.08);

    background:rgba(10,12,17,.38);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    position:relative;
    z-index:5;
}

.menu-btn{
    width:43px;
    height:43px;

    border:1px solid transparent;
    border-radius:12px;

    background:transparent;

    color:#ddd;

    cursor:pointer;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.menu-btn:hover{
    background:rgba(255,255,255,.08);
}

.top-title{
    margin-left:9px;

    font-size:15px;
    font-weight:600;

    color:#eee;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.messages{
    width:min(900px,100%);
    margin:0 auto;

    padding:28px 20px 155px;
}

.message-row{
    width:100%;
    display:flex;

    margin:19px 0;

    scroll-margin-top:80px;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.assistant{
    justify-content:flex-start;
}

.message{
    max-width:min(760px,88%);

    line-height:1.65;
    font-size:15px;

    word-wrap:break-word;
}

.user .message{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.07)
        );

    border:1px solid rgba(255,255,255,.09);

    border-radius:19px;

    padding:10px 15px;

    color:#f1f1f1;

    box-shadow:
        0 10px 30px rgba(0,0,0,.12);
}

.assistant .message{
    padding:3px 0;
    color:#e5e5e5;
}

.message p{
    margin:0 0 12px;
}

.message p:last-child{
    margin-bottom:0;
}

/* =========================
   CODE
========================= */

.message code:not(.code-content){
    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.10);

    border-radius:5px;

    padding:2px 5px;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size:13px;
}

.code-block{
    position:relative;

    margin:14px 0;

    border:1px solid rgba(255,255,255,.10);

    border-radius:13px;

    overflow:hidden;

    background:rgba(0,0,0,.38);

    max-width:100%;

    box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.code-header{
    min-height:39px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    padding:0 8px;

    border-bottom:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);
}

.code-language{
    margin-right:auto;

    color:#777;

    font-size:11px;
}

.copy-code{
    display:flex;
    align-items:center;
    gap:5px;

    border:0;
    border-radius:7px;

    padding:6px 9px;

    background:transparent;

    color:#aaa;

    font-size:12px;

    cursor:pointer;

    transition:.15s;
}

.copy-code:hover{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.copy-code.copied{
    color:#fff;
}

.code-content{
    display:block;

    margin:0;

    padding:14px;

    overflow-x:auto;

    color:#ddd;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size:13px;
    line-height:1.6;

    white-space:pre;

    tab-size:2;
}

/* =========================
   WELCOME
========================= */

.welcome{
    min-height:calc(100vh - 64px);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px 20px 150px;

    text-align:center;
}

.welcome-inner{
    max-width:620px;
}

.welcome-logo{
    width:58px;
    height:58px;

    border-radius:19px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.04)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.08);

    color:#fff;

    font-size:25px;
}

.welcome h1{
    margin:0 0 10px;

    font-size:27px;
    font-weight:600;
}

.welcome p{
    margin:0;

    color:#999;

    font-size:14px;
}

/* =========================
   COMPOSER
========================= */

.composer-area{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:15px 18px 20px;

    background:
        linear-gradient(
            to top,
            rgba(9,11,16,.95) 50%,
            transparent
        );

    pointer-events:none;
}

.composer{
    pointer-events:auto;

    width:min(850px,100%);

    margin:0 auto;

    min-height:56px;

    border:1px solid rgba(255,255,255,.13);

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.045)
        );

    display:flex;
    align-items:flex-end;

    padding:8px 8px 8px 15px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.07);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

#messageInput{
    flex:1;
    min-width:0;

    max-height:180px;
    min-height:36px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#eee;

    padding:8px 5px;

    line-height:1.45;

    overflow-y:auto;
}

#messageInput::placeholder{
    color:#777;
}

#sendButton{
    width:39px;
    height:39px;

    flex-shrink:0;

    border:1px solid rgba(255,255,255,.12);

    border-radius:12px;

    background:rgba(255,255,255,.95);

    color:#111;

    cursor:pointer;

    font-size:18px;

    margin-left:7px;

    transition:.15s;
}

#sendButton:hover{
    background:#fff;
    transform:translateY(-1px);
}

#sendButton:disabled{
    opacity:.4;
    cursor:default;
    transform:none;
}

.disclaimer{
    text-align:center;

    font-size:10px;

    color:#666;

    margin-top:7px;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    gap:4px;
    padding:8px 0;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#888;

    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        opacity:.3;
        transform:translateY(0);
    }

    30%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* =========================
   SCROLLBAR
========================= */

*::-webkit-scrollbar{
    width:6px;
    height:6px;
}

*::-webkit-scrollbar-track{
    background:transparent;
}

*::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:20px;
}

*::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.20);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        position:absolute;

        left:0;
        top:0;
        bottom:0;

        width:min(320px,88vw);

        transform:translateX(-100%);

        box-shadow:
            15px 0 50px rgba(0,0,0,.4);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .messages{
        padding-left:14px;
        padding-right:14px;
    }

    .message{
        max-width:92%;
    }

    .top-title{
        font-size:14px;
    }

    .composer-area{
        padding-left:10px;
        padding-right:10px;
    }

    .welcome h1{
        font-size:23px;
    }
}

@media(min-width:701px){

    .sidebar{
        transform:translateX(0);
    }

    .sidebar:not(.force-open){
        display:none;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="app">

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">

        <button
            id="newChatButton"
            class="new-chat-btn"
            type="button"
        >
            <span class="new-chat-icon">＋</span>
            <span>Percakapan baru</span>
        </button>

        <button
            id="closeSidebar"
            class="close-sidebar"
            type="button"
            aria-label="Tutup"
        >
            ×
        </button>

    </div>

    <!-- SEARCH -->
    <div class="search-box">

        <div class="search-wrapper">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="search"
                placeholder="Cari pesan..."
                autocomplete="off"
            >

        </div>

    </div>

    <!-- SEARCH RESULTS -->
    <div
        id="searchResults"
        class="search-results"
    ></div>

    <!-- NORMAL CONVERSATIONS -->
    <div
        id="conversationTitle"
        class="conversation-title"
    >
        Percakapan
    </div>

    <div
        id="conversationList"
        class="conversation-list"
    ></div>

</aside>


<!-- MAIN -->
<main class="main">

    <header class="topbar">

        <button
            id="menuButton"
            class="menu-btn"
            type="button"
            aria-label="Menu"
        >
            ☰
        </button>

        <div
            id="topTitle"
            class="top-title"
        >
            AI Chat
        </div>

    </header>


    <section
        id="chat"
        class="chat"
    >

        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-inner">

                <div class="welcome-logo">
                    ✦
                </div>

                <h1>
                    Ada yang bisa saya bantu?
                </h1>

                <p>
                    Mulai percakapan baru dengan AI.
                </p>

            </div>

        </div>

        <div
            id="messages"
            class="messages"
            style="display:none"
        ></div>

    </section>


    <!-- COMPOSER -->
    <div class="composer-area">

        <form
            id="composer"
            class="composer"
        >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Tanya apa saja..."
                autocomplete="off"
            ></textarea>

            <button
                id="sendButton"
                type="submit"
                aria-label="Kirim"
            >
                ↑
            </button>

        </form>

        <div class="disclaimer">
            AI dapat membuat kesalahan. Periksa informasi penting.
        </div>

    </div>

</main>

</div>


<script>

const STORAGE_KEY = 'ai_chat_conversations_v3';

let conversations = loadConversations();

let currentConversationId =
    localStorage.getItem('ai_current_conversation');

let isSending = false;


/* =========================
   STORAGE
========================= */

function loadConversations(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved) return [];

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch{

        return [];

    }

}


function saveConversations(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversations)
    );

    if(currentConversationId){

        localStorage.setItem(
            'ai_current_conversation',
            currentConversationId
        );

    }

}


/* =========================
   ELEMENTS
========================= */

const sidebar =
    document.getElementById('sidebar');

const menuButton =
    document.getElementById('menuButton');

const closeSidebar =
    document.getElementById('closeSidebar');

const newChatButton =
    document.getElementById('newChatButton');

const conversationList =
    document.getElementById('conversationList');

const conversationTitle =
    document.getElementById('conversationTitle');

const searchInput =
    document.getElementById('searchInput');

const searchResults =
    document.getElementById('searchResults');

const messages =
    document.getElementById('messages');

const welcome =
    document.getElementById('welcome');

const messageInput =
    document.getElementById('messageInput');

const composer =
    document.getElementById('composer');

const sendButton =
    document.getElementById('sendButton');

const topTitle =
    document.getElementById('topTitle');

const chat =
    document.getElementById('chat');


/* =========================
   SIDEBAR
========================= */

menuButton.addEventListener(
    'click',
    () => {

        sidebar.classList.add('open');
        sidebar.classList.add('force-open');

        renderConversationList();

    }
);


closeSidebar.addEventListener(
    'click',
    () => {

        sidebar.classList.remove('open');

    }
);


newChatButton.addEventListener(
    'click',
    () => {

        createNewConversation();

        if(window.innerWidth <= 700){

            sidebar.classList.remove('open');

        }

        messageInput.focus();

    }
);


/* =========================
   NEW CONVERSATION
========================= */

function createNewConversation(){

    const id =
        crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now() +
              '_' +
              Math.random()
                  .toString(36)
                  .slice(2);

    const conversation = {

        id,

        title:'Percakapan baru',

        messages:[],

        createdAt:Date.now()

    };

    conversations.unshift(conversation);

    currentConversationId = id;

    saveConversations();

    renderConversationList();

    renderConversation();

}


/* =========================
   CURRENT CHAT
========================= */

function getCurrentConversation(){

    return conversations.find(
        item =>
            item.id === currentConversationId
    );

}


/* =========================
   CONVERSATION LIST
========================= */

function renderConversationList(){

    conversationList.innerHTML = '';

    if(!conversations.length){

        conversationList.innerHTML =
            '<div class="empty-conversations">Tidak ada percakapan.</div>';

        return;

    }

    conversations.forEach(
        conversation => {

            const button =
                document.createElement('button');

            button.type = 'button';

            button.className =
                'conversation-item' +
                (
                    conversation.id === currentConversationId
                        ? ' active'
                        : ''
                );

            button.textContent =
                conversation.title ||
                'Percakapan baru';

            button.addEventListener(
                'click',
                () => {

                    currentConversationId =
                        conversation.id;

                    saveConversations();

                    renderConversationList();

                    renderConversation();

                    if(window.innerWidth <= 700){

                        sidebar.classList.remove(
                            'open'
                        );

                    }

                }
            );

            conversationList.appendChild(button);

        }
    );

}


/* =========================
   RENDER CHAT
========================= */

function renderConversation(){

    const conversation =
        getCurrentConversation();

    if(
        !conversation ||
        !conversation.messages.length
    ){

        welcome.style.display = 'flex';

        messages.style.display = 'none';

        messages.innerHTML = '';

        topTitle.textContent = 'AI Chat';

        return;

    }

    welcome.style.display = 'none';

    messages.style.display = 'block';

    messages.innerHTML = '';

    topTitle.textContent =
        conversation.title ||
        'AI Chat';

    conversation.messages.forEach(
        message => {

            addMessageToDOM(
                message.role,
                message.content
            );

        }
    );

    scrollToBottom();

}


/* =========================
   MESSAGE DOM
========================= */

function addMessageToDOM(
    role,
    text,
    messageIndex = null
){

    const row =
        document.createElement('div');

    row.className =
        'message-row ' +
        (
            role === 'user'
                ? 'user'
                : 'assistant'
        );

    if(messageIndex !== null){

        row.dataset.messageIndex =
            messageIndex;

    }

    const message =
        document.createElement('div');

    message.className = 'message';

    if(role === 'user'){

        message.textContent = text;

    }else{

        message.innerHTML =
            formatMessage(text);

    }

    row.appendChild(message);

    messages.appendChild(row);

    return row;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================
   FORMAT MESSAGE
========================= */

function formatMessage(text){

    let html =
        escapeHTML(text);

    const codeBlocks = [];

    html =
        html.replace(
            /```(?:([\w+#.-]+))?\n?([\s\S]*?)```/g,
            (
                match,
                language,
                code
            ) => {

                const codeId =
                    'code_' +
                    Math.random()
                        .toString(36)
                        .substring(2,10);

                const placeholder =
                    `___CODE_BLOCK_${codeBlocks.length}___`;

                codeBlocks.push({

                    placeholder,

                    html:`

                        <div class="code-block">

                            <div class="code-header">

                                <span class="code-language">
                                    ${language || 'code'}
                                </span>

                                <button
                                    class="copy-code"
                                    type="button"
                                    data-code-id="${codeId}"
                                >
                                    📋 Copy
                                </button>

                            </div>

                            <pre
                                id="${codeId}"
                                class="code-content"
                            >${code}</pre>

                        </div>

                    `

                });

                return placeholder;

            }
        );


    html =
        html.replace(
            /`([^`]+)`/g,
            '<code>$1</code>'
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            '<strong>$1</strong>'
        );


    html =
        html.replace(
            /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
            '$1<em>$2</em>'
        );


    html =
        html.replace(
            /\n/g,
            '<br>'
        );


    codeBlocks.forEach(
        block => {

            html =
                html.replace(
                    block.placeholder,
                    block.html
                );

        }
    );

    return html;

}


/* =========================
   COPY CODE
========================= */

async function copyCode(
    id,
    button
){

    const codeElement =
        document.getElementById(id);

    if(!codeElement) return;

    const code =
        codeElement.textContent;

    try{

        await navigator.clipboard.writeText(
            code
        );

        button.innerHTML =
            '✓ Copied';

        button.classList.add(
            'copied'
        );

        setTimeout(
            () => {

                button.innerHTML =
                    '📋 Copy';

                button.classList.remove(
                    'copied'
                );

            },
            1500
        );

    }catch(error){

        const textarea =
            document.createElement(
                'textarea'
            );

        textarea.value = code;

        textarea.style.position =
            'fixed';

        textarea.style.left =
            '-9999px';

        document.body.appendChild(
            textarea
        );

        textarea.focus();

        textarea.select();

        try{

            document.execCommand(
                'copy'
            );

            button.innerHTML =
                '✓ Copied';

            button.classList.add(
                'copied'
            );

            setTimeout(
                () => {

                    button.innerHTML =
                        '📋 Copy';

                    button.classList.remove(
                        'copied'
                    );

                },
                1500
            );

        }catch{

            button.innerHTML =
                'Copy gagal';

        }

        textarea.remove();

    }

}


document.addEventListener(
    'click',
    event => {

        const button =
            event.target.closest(
                '.copy-code'
            );

        if(!button) return;

        copyCode(
            button.dataset.codeId,
            button
        );

    }
);


/* =========================
   SCROLL
========================= */

function scrollToBottom(){

        () => {

            chat.scrollTop =

        }
    );

}


/* =========================
   TYPING
========================= */

function addTypingIndicator(){

    const row =
        document.createElement('div');

    row.className =
        'message-row assistant';

    row.id =
        'typingIndicator';

    row.innerHTML = `

        <div class="message">

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;

    messages.appendChild(row);

    scrollToBottom();

}


function removeTypingIndicator(){

    const element =
        document.getElementById(
            'typingIndicator'
        );

    if(element){

        element.remove();

    }

}


/* =========================
   SEARCH
========================= */

/*
    Mencari SEMUA pesan yang
    mengandung kata yang dicari.
*/

function searchMessages(keyword){

    keyword =
        keyword.trim();

    searchResults.innerHTML = '';

    if(!keyword){

        searchResults.classList.remove(
            'visible'
        );

        conversationList.classList.remove(
            'hidden'
        );

        conversationTitle.style.display =
            '';

        return;

    }

    searchResults.classList.add(
        'visible'
    );

    conversationList.classList.add(
        'hidden'
    );

    conversationTitle.style.display =
        'none';


    const lowerKeyword =
        keyword.toLowerCase();

    const results = [];


    conversations.forEach(
        conversation => {

            conversation.messages.forEach(
                (message,index) => {

                    const content =
                        String(
                            message.content || ''
                        );

                    if(
                        content
                            .toLowerCase()
                            .includes(lowerKeyword)
                    ){

                        results.push({

                            conversationId:
                                conversation.id,

                            conversationTitle:
                                conversation.title ||
                                'Percakapan baru',

                            messageIndex:
                                index,

                            role:
                                message.role,

                            content

                        });

                    }

                }
            );

        }
    );


    if(!results.length){

        searchResults.innerHTML = `

            <div class="search-empty">

                Tidak ditemukan pesan yang mengandung
                <strong>${escapeHTML(keyword)}</strong>.

            </div>

        `;

        return;

    }


    const title =
        document.createElement('div');

    title.className =
        'search-results-title';

    title.textContent =
        `${results.length} hasil ditemukan`;

    searchResults.appendChild(title);


    results.forEach(
        result => {

            const card =
                document.createElement('button');

            card.type =
                'button';

            card.className =
                'search-result';


            const chatName =
                document.createElement('div');

            chatName.className =
                'search-result-chat';

            chatName.textContent =
                result.conversationTitle;


            const text =
                document.createElement('div');

            text.className =
                'search-result-text';


            text.innerHTML =
                highlightSearchResult(
                    result.content,
                    keyword
                );


            card.appendChild(
                chatName
            );

            card.appendChild(
                text
            );


            card.addEventListener(
                'click',
                () => {

                    openSearchResult(
                        result
                    );

                }
            );


            searchResults.appendChild(
                card
            );

        }
    );

}


/* =========================
   HIGHLIGHT SEARCH
========================= */

function highlightSearchResult(
    text,
    keyword
){

    const safeText =
        escapeHTML(text);

    const safeKeyword =
        escapeHTML(keyword);

    /*
       Menampilkan bagian sekitar
       kata yang ditemukan.
    */

    const lowerText =
        text.toLowerCase();

    const index =
        lowerText.indexOf(
            keyword.toLowerCase()
        );

    let snippet =
        text;


    if(
        text.length > 180 &&
        index !== -1
    ){

        const start =
            Math.max(
                0,
                index - 75
            );

        const end =
            Math.min(
                text.length,
                index + keyword.length + 100
            );

        snippet =
            (start > 0 ? '... ' : '') +
            text.slice(start,end) +
            (end < text.length ? ' ...' : '');

    }


    let html =
        escapeHTML(snippet);


    const escapedKeyword =
        escapeRegExp(
            keyword
        );


    html =
        html.replace(
            new RegExp(
                '(' +
                escapedKeyword +
                ')',
                'gi'
            ),
            '<mark>$1</mark>'
        );


    return html;

}


function escapeRegExp(text){

    return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        '\\$&'
    );

}


/* =========================
   OPEN SEARCH RESULT
========================= */

function openSearchResult(result){

    currentConversationId =
        result.conversationId;

    saveConversations();

    renderConversationList();

    renderConversation();

    /*
       Tunggu DOM selesai dibuat,
       kemudian cari pesan berdasarkan index.
    */

    requestAnimationFrame(
        () => {

            const target =
                messages.querySelector(
                    `[data-message-index="${result.messageIndex}"]`
                );


            /*
               Karena renderConversation()
               sebelumnya belum memberikan
               index, cari ulang berdasarkan
               urutan pesan.
            */

            const allRows =
                messages.querySelectorAll(
                    '.message-row'
                );

            const row =
                allRows[result.messageIndex];


            if(row){

                row.scrollIntoView({

                    behavior:'smooth',

                    block:'center'

                });


                row.animate(
                    [
                        {
                            background:
                                'rgba(255,220,100,.18)'
                        },
                        {
                            background:
                                'transparent'
                        }
                    ],
                    {
                        duration:1000
                    }
                );

            }

        }
    );


    /*
       Di mobile, tutup sidebar
       setelah hasil dipilih.
    */

    if(window.innerWidth <= 700){

        sidebar.classList.remove(
            'open'
        );

    }

}


/* =========================
   SEARCH INPUT
========================= */

searchInput.addEventListener(
    'input',
    () => {

        searchMessages(
            searchInput.value
        );

    }
);


searchInput.addEventListener(
    'keydown',
    event => {

        if(event.key !== 'Escape')
            return;

        searchInput.value = '';

        searchMessages('');

        searchInput.blur();

    }
);


/* =========================
   SEND MESSAGE
========================= */

composer.addEventListener(
    'submit',
    async event => {

        event.preventDefault();

        await sendMessage();

    }
);


async function sendMessage(){

    if(isSending)
        return;


    const prompt =
        messageInput.value.trim();


    if(!prompt)
        return;


    if(!currentConversationId){

        createNewConversation();

    }


    const conversation =
        getCurrentConversation();


    if(!conversation)
        return;


    if(conversation.messages.length === 0){

        conversation.title =
            prompt.length > 45
                ? prompt.slice(0,45) + '...'
                : prompt;

    }


    conversation.messages.push({

        role:'user',

        content:prompt,

        createdAt:Date.now()

    });


    saveConversations();

    renderConversationList();

    renderConversation();


    messageInput.value = '';

    autoResizeTextarea();


    isSending = true;

    sendButton.disabled = true;


    addTypingIndicator();


    try{

        const response =
            await fetch(
                '/api/chat',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        message:prompt
                    })

                }
            );


        const data =
            await response.json();


        removeTypingIndicator();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                'Gagal mendapatkan jawaban'
            );

        }


        conversation.messages.push({

            role:'assistant',

            content:
                data.answer ||
                '(Tidak ada jawaban)',

            createdAt:
                Date.now()

        });


        saveConversations();

        renderConversationList();

        renderConversation();


    }catch(error){

        removeTypingIndicator();


        conversation.messages.push({

            role:'assistant',

            content:
                'Terjadi kesalahan: ' +
                error.message,

            createdAt:
                Date.now()

        });


        saveConversations();

        renderConversation();

    }finally{

        isSending = false;

        sendButton.disabled = false;

        messageInput.focus();

    }

}


/* =========================
   TEXTAREA
========================= */

function autoResizeTextarea(){

    messageInput.style.height =
        'auto';

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            180
        ) + 'px';

}


messageInput.addEventListener(
    'input',
    autoResizeTextarea
);


messageInput.addEventListener(
    'keydown',
    event => {

        if(
            event.key === 'Enter' &&
            !event.shiftKey
        ){

            event.preventDefault();

            composer.requestSubmit();

        }

    }
);


/* =========================
   INIT
========================= */

if(
    !currentConversationId &&
    conversations.length
){

    currentConversationId =
        conversations[0].id;

}


if(
    currentConversationId &&
    !getCurrentConversation()
){

    currentConversationId = null;

}


renderConversationList();

renderConversation();

messageInput.focus();

</script>
